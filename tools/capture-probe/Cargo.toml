[package]
name = "capture-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[dependencies]
cidre = { version = "=0.29.0", default-features = false, features = ["core_audio", "sc", "async", "macos_14_2"] }
libc = "0.2"
ringbuf = "0.4"
rustfft = "6"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
