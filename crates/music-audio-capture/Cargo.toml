[package]
name = "music-audio-capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Isolated native macOS audio capture for apple-music-tui"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "=0.29.0", default-features = false, features = ["core_audio", "sc", "async", "macos_14_2"] }
ringbuf = "0.4"
tokio = { version = "1", features = ["rt", "time"] }
